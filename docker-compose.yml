services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pgv-postgres
    ports:
      - "5400:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dbem

  web:
    build: . # Dockerfile 위치
    container_name: fastapi-dbem-app
    ports:
      - "8000:8000"
    depends_on:
      - db
